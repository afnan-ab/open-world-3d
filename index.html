<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open World 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #blocker {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      z-index: 10;
    }
    #blocker h1 { font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 600; }
    #blocker p { font-size: 1.1rem; opacity: 0.85; margin: 0.3rem 0; }
    #instructions { margin-top: 1.5rem; line-height: 1.6; opacity: 0.7; }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      pointer-events: none;
      display: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="blocker">
    <h1>Open World 3D</h1>
    <p>High-fidelity open-world exploration</p>
    <div id="instructions">
      Click to start<br>
      WASD — Move &nbsp;|&nbsp; Mouse — Look<br>
      Space — Jump &nbsp;|&nbsp; Shift — Sprint
    </div>
  </div>
  <div id="crosshair"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
